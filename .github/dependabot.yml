version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions are upgraded deliberately, with manual testing.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # v6 moved caching into a proprietary component with separate terms of use.
      - dependency-name: gradle/actions
        versions: ['>=6']
