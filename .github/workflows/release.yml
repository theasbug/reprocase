name: Release
# Builds the desktop app for Windows, macOS (Apple Silicon and Intel) and Linux from a tagged
# commit, smoke-tests each package on its own platform, records signed build-provenance
# attestations and creates a DRAFT GitHub release for review.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (for example v1.1.0-beta.6)
        required: true
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win32, arch: x64, label: Windows-x64 }
          - { os: macos-latest, platform: darwin, arch: arm64, label: macOS-arm64 }
          - { os: macos-15-intel, platform: darwin, arch: x64, label: macOS-x64 }
          - { os: ubuntu-latest, platform: linux, arch: x64, label: Linux-x64 }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
      REPROCASE_HEADLESS: '1'
      REPROCASE_PACKAGE_OUT: ${{ github.workspace }}/release/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Linux system packages for Chromium, Electron and a virtual display
        if: runner.os == 'Linux'
        run: |
          npx playwright install-deps chromium
          sudo apt-get install -y xvfb
          # Ubuntu 24.04 restricts unprivileged user namespaces, which Electron's sandbox needs.
          # This changes only the CI machine; the Linux download notes explain the same for users.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run browsers:install
      - run: npm run typecheck
      - run: npm test
      - run: npm run desktop:package
      - name: Smoke-test the packaged app
        shell: bash
        run: |
          base="$REPROCASE_PACKAGE_OUT/ReproCase-${{ matrix.platform }}-${{ matrix.arch }}"
          case "${{ matrix.platform }}" in
            win32)  export REPROCASE_DESKTOP_EXE="$base/ReproCase.exe"; npm run test:desktop -- desktop.spec.ts smoke.spec.ts ;;
            darwin) export REPROCASE_DESKTOP_EXE="$base/ReproCase.app/Contents/MacOS/ReproCase"; npm run test:desktop -- smoke.spec.ts ;;
            linux)  export REPROCASE_DESKTOP_EXE="$base/ReproCase"; xvfb-run -a npm run test:desktop -- smoke.spec.ts ;;
          esac
      - name: Create the archive
        shell: bash
        run: |
          version="${TAG#v}"
          base="ReproCase-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p dist
          case "${{ matrix.platform }}" in
            win32)  pwsh -NoProfile -Command "Compress-Archive -Path '$REPROCASE_PACKAGE_OUT/$base/*' -DestinationPath 'dist/ReproCase-$version-${{ matrix.label }}.zip'" ;;
            # ditto keeps the app bundle's symlinks and metadata intact.
            darwin) ditto -c -k --sequesterRsrc --keepParent "$REPROCASE_PACKAGE_OUT/$base/ReproCase.app" "dist/ReproCase-$version-${{ matrix.label }}.zip" ;;
            linux)  tar -C "$REPROCASE_PACKAGE_OUT" -czf "dist/ReproCase-$version-${{ matrix.label }}.tar.gz" "$base" ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
  publish:
    runs-on: ubuntu-latest
    needs: desktop
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the provenance attestation
      attestations: write  # store the attestation
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Source archive and checksums
        id: dist
        run: |
          version="${TAG#v}"
          git archive --format=zip --prefix="reprocase-$version/" -o "dist/ReproCase-$version-source.zip" HEAD
          (cd dist && sha256sum ReproCase-*.zip ReproCase-*.tar.gz > "ReproCase-$version-SHA256SUMS.txt")
          cat "dist/ReproCase-$version-SHA256SUMS.txt"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          case "$TAG" in *-*) extra+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --draft --verify-tag --title "ReproCase ${{ steps.dist.outputs.version }}" --generate-notes "${extra[@]}"
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        run: |
          version="${TAG#v}"
          tags="ghcr.io/theasbug/reprocase:${version}"
          case "$TAG" in *-*) ;; *) tags="$tags,ghcr.io/theasbug/reprocase:latest" ;; esac
          case "$TAG" in *-beta*) tags="$tags,ghcr.io/theasbug/reprocase:beta" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/theasbug/reprocase
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
  burp-extension:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - run: gradle --no-daemon jar
        working-directory: integrations/burp
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: integrations/burp/build/libs/*.jar
      - name: Attach the jar to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" integrations/burp/build/libs/*.jar --clobber
