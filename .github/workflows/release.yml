name: Release
# Builds the Windows portable archive from a tagged commit, records a signed
# build-provenance attestation and creates a DRAFT GitHub release for review.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (for example v1.1.0-beta.2)
        required: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the provenance attestation
      attestations: write  # store the attestation
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
      REPROCASE_HEADLESS: '1'
      REPROCASE_PACKAGE_OUT: ${{ github.workspace }}/release/windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run browsers:install
      - run: npm run typecheck
      - run: npm test
      - run: npm run desktop:package
      - name: Smoke-test the packaged executable
        shell: pwsh
        run: |
          $env:REPROCASE_DESKTOP_EXE = Join-Path $env:REPROCASE_PACKAGE_OUT 'ReproCase-win32-x64/ReproCase.exe'
          npm run test:desktop -- desktop.spec.ts
      - name: Create archive and checksums
        id: dist
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/ReproCase-$version-Windows-x64.zip"
          Compress-Archive -Path "$env:REPROCASE_PACKAGE_OUT/ReproCase-win32-x64/*" -DestinationPath $zip
          git archive --format=zip --prefix="reprocase-$version/" -o "dist/ReproCase-$version-source.zip" HEAD
          $lines = Get-ChildItem dist -Filter *.zip | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content -Encoding ascii "dist/ReproCase-$version-SHA256SUMS.txt"
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $extra = @()
          if ($env:TAG -match '-') { $extra += '--prerelease' }
          $files = (Get-ChildItem dist).FullName
          gh release create $env:TAG @files --draft --verify-tag --title "ReproCase ${{ steps.dist.outputs.version }}" --generate-notes @extra
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        run: |
          version="${TAG#v}"
          tags="ghcr.io/theasbug/reprocase:${version}"
          case "$TAG" in *-*) ;; *) tags="$tags,ghcr.io/theasbug/reprocase:latest" ;; esac
          case "$TAG" in *-beta*) tags="$tags,ghcr.io/theasbug/reprocase:beta" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/theasbug/reprocase
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
  burp-extension:
    runs-on: ubuntu-latest
    needs: windows
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'
      - run: gradle --no-daemon jar
        working-directory: integrations/burp
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: integrations/burp/build/libs/*.jar
      - name: Attach the jar to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" integrations/burp/build/libs/*.jar --clobber
