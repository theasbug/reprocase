name: Verify source and Windows release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
      REPROCASE_HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install-deps chromium
        if: runner.os == 'Linux'
      - run: npm run browsers:install
      - run: npm run typecheck
      - run: npm test
      - run: npm run desktop:build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-${{ matrix.os }}
          path: |
            test-results
            playwright-report
  windows-release:
    runs-on: windows-latest
    needs: source
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
      REPROCASE_HEADLESS: '1'
      REPROCASE_PACKAGE_OUT: ${{ github.workspace }}/release/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run browsers:install
      - run: npm run desktop:package
      - name: Test the packaged executable
        shell: pwsh
        run: |
          $env:REPROCASE_DESKTOP_EXE = Join-Path $env:REPROCASE_PACKAGE_OUT 'ReproCase-win32-x64/ReproCase.exe'
          npm run test:desktop -- desktop.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: windows-beta
          path: release/windows/ReproCase-win32-x64
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reprocase:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name rc -p 127.0.0.1:4317:4317 reprocase:ci
          for i in $(seq 1 60); do docker logs rc 2>&1 | grep -q 'token=' && break; sleep 2; done
          docker logs rc 2>&1 | sed 's/token=[0-9a-f]*/token=REDACTED/'
          token=$(docker logs rc 2>&1 | grep -o 'token=[0-9a-f]*' | head -1 | cut -d= -f2)
          test -n "$token"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://127.0.0.1:4317/api/state)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4317/api/state)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.test' http://127.0.0.1:4317/)" = 403
          curl -sf http://127.0.0.1:4317/ | grep -qi '<div id="root"\|<html'
      - if: always()
        run: docker rm -f rc || true
  burp-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/burp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - run: gradle --no-daemon jar
      - uses: actions/upload-artifact@v4
        with:
          name: reprocase-burp
          path: integrations/burp/build/libs/*.jar
